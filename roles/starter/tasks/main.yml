---
- name: Validate role activation
  ansible.builtin.debug:
    msg: "{{ starter_message }}"
  when: starter_enabled | bool

- name: Create demo directory on POSIX targets
  ansible.builtin.file:
    path: "{{ project_demo_dir | default('/tmp/awx-starter-demo') }}"
    state: directory
    mode: '0755'
  when:
    - starter_create_demo_file | bool
    - ansible_os_family is defined and ansible_os_family != 'Windows'
  ignore_errors: true

- name: Create sample status file on POSIX targets
  ansible.builtin.copy:
    dest: "{{ starter_demo_file_path }}"
    content: |
      Project: {{ project_name }}
      Environment: {{ project_environment }}
      Provisioned by: AWX Starter Role
      Timestamp: {{ ansible_date_time.iso8601 | default('N/A') }}
    mode: '0644'
  when:
    - starter_create_demo_file | bool
    - ansible_os_family is defined and ansible_os_family != 'Windows'
  ignore_errors: true
  notify: Notify starter completion

