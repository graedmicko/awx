apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Official AWX Operator release
  - github.com/ansible/awx-operator/config/default?ref=2.19.1
  # Local AWX CR definition
  - awx-instance.yaml

# Target namespace
namespace: awx

# Replace deprecated gcr.io image with active quay.io mirror
images:
  - name: gcr.io/kubebuilder/kube-rbac-proxy
    newName: quay.io/brancz/kube-rbac-proxy
    newTag: v0.15.0
